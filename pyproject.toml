[project]
name = "gaze-cursor"
version = "0.1.0"
description = "Move the macOS cursor by tracking eye gaze through a webcam."
requires-python = "==3.12.*"
dependencies = [
    "mediapipe>=1.1.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pyobjc-framework-quartz>=12.2.2",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaze_cursor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
